plugins {
    id 'net.minecraftforge.gradle' version '[5.1,6.0)'
}

version = '1.4.1'
group = 'dev.handyshulkers'

base {
    archivesName = 'handyshulkers-forge-1.18.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.18.2'

    // Standard MDK dev-run configurations (FG5 template shape): without this
    // block ForgeGradle creates no runServer/runClient tasks, so a fresh clone
    // cannot launch the mod in a dev environment.
    runs {
        client {
            workingDirectory project.file('run')

            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console.
            property 'forge.logging.console.level', 'info'

            mods {
                handyshulkers {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                handyshulkers {
                    source sourceSets.main
                }
            }

            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'handyshulkers',
            'Specification-Version': '1',
            'Implementation-Title': project.base.archivesName.get(),
            'Implementation-Version': project.version
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
